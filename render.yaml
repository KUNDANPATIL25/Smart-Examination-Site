services:
  - type: web
    name: ai-exam-backend
    env: java
    rootDir: backend
    buildCommand: cd backend && mvn clean install
    startCommand: java -jar target/*.jar
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: ai-exam-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://ai-exam-backend.onrender.com/api
