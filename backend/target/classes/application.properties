server.port=8081
spring.application.name=ai-exam-backend

# ---- Gemini API config ----
# Put your real key here, or (recommended) export GEMINI_API_KEY as an environment
# variable and leave this as-is.
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6Kv3No_hCeOZzY-EnQZJab3QUJRityNvAVdcgcrpXQ6Vg}
gemini.api.model=gemini-3-flash-preview
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.api.model}:generateContent

# ---- Rate limiting (protects the free Gemini tier) ----
# Max test-generation requests allowed per client IP per refill window.
ratelimit.capacity=50
ratelimit.refill-tokens=50
ratelimit.refill-duration-minutes=1

# CORS - React dev server
app.cors.allowed-origin=http://localhost:3000

logging.level.com.aiexam=INFO
